[project]
name = "sspak"
version = "0.1.0"
description = "Pak / uasset tooling for the StarLit Season Android port verification pipeline"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
render = [
    "numpy>=1.26",
    "moderngl>=5.10",
    "Pillow>=10",
]

[project.scripts]
sspak = "sspak.cli:main"

[tool.setuptools]
packages = ["sspak"]
